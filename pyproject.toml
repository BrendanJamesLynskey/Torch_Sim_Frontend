[build-system]
requires = ["setuptools>=68", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "simfront"
version = "0.1.0"
description = "Turn PyTorch and ONNX models into operator traces (dispatch trace on the meta device, torch.export, a torch.compile backend, ONNX graph walk) and cost them on a pluggable accelerator model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "transformers>=4.50",
    "onnx>=1.17",
    "onnxscript>=0.3",
    "simpy>=4.1",
    "disagg-sim @ git+https://github.com/BrendanJamesLynskey/Disaggregated_Inference_Sim",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "pytest-cov", "onnxruntime>=1.20", "matplotlib>=3.8"]
plot = ["matplotlib>=3.8"]

[project.scripts]
simfront = "simfront.cli:main"
simfront-accel = "simfront.accel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simfront = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
