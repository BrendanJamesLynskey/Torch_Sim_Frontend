name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        # The oldest supported transformers and the newest. 5.19 changed how the rotary frequencies are computed
        # (elementwise, not a matmul), which the closed forms follow; both sides of that change are tested.
        transformers: ["5.18.0", "latest"]
    name: test (Python ${{ matrix.python }}, transformers ${{ matrix.transformers }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ "${{ matrix.transformers }}" = "latest" ]; then
            pip install -e ".[test]" ruff
          else
            pip install -e ".[test]" ruff "transformers==${{ matrix.transformers }}"
          fi
          python -c "import transformers, torch; print('transformers', transformers.__version__, 'torch', torch.__version__)"
      - name: Lint
        run: ruff check src tests ci examples
      - name: Tests (rules, front ends, closed forms, cost models, the SimPy accelerator and its C++ fast path)
        env:
          SIMFRONT_REQUIRE_CPP: "1"     # fail, rather than fall back to Python, if the pybind11 module did not build
        run: pytest -p no:logging --cov=simfront
      - name: Arithmetic and drift gate
        run: python ci/perf_gate.py --margin 3.0
      - name: CLI smoke test (Llama-3-70B on the meta device)
        run: simfront --model llama3-70b --tokens 1024 --offload optical --top 5
      - name: Accelerator smoke test (CNN timeline, NTT workload on the C++ fast path, cycle-stepped twin)
        run: |
          simfront-accel --model tiny-cnn --route onnx --timeline cnn.png --chrome cnn.json
          simfront-accel --workload polymul --log-n 14 --limbs 4 --transit 1.6 --engine fast
          simfront-accel --model tiny-cnn --engine cycle --top 3
